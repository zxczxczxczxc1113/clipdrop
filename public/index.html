<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ClipDrop</title>
<style>
  :root {
    --bg: #09090b; --panel: #131316; --border: #27272a; --text: #fafafa;
    --dim: #71717a; --accent: #6366f1; --accent-hover: #818cf8; --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; min-height: 100vh; }
  header { padding: 24px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; }
  header h1 span { color: var(--accent); }
  header p { margin: 0; color: var(--dim); font-size: 13px; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 28px; }
  #dropzone {
    border: 2px dashed var(--border); border-radius: 12px; padding: 56px 24px;
    text-align: center; cursor: pointer; background: var(--panel);
  }
  #dropzone.drag { border-color: var(--accent); background: rgba(99,102,241,0.06); }
  #dropzone strong { display: block; font-size: 16px; margin-bottom: 6px; }
  #dropzone small { color: var(--dim); font-size: 13px; }
  #fileInput { display: none; }
  #queue { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
  .upload-row { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .upload-row .top { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; margin-bottom: 8px; }
  .upload-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .upload-row .status { color: var(--dim); flex-shrink: 0; }
  .upload-row .status.done { color: #4ade80; }
  .upload-row .status.error { color: var(--danger); }
  .bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.15s; }
  .upload-row a { display: inline-block; margin-top: 10px; color: var(--accent-hover); font-size: 13px; text-decoration: none; }
  .library { margin-top: 48px; }
  .library h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .clip-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; text-decoration: none; color: inherit; }
  .clip-card:hover { border-color: var(--accent); }
  .clip-card .thumb { width: 100%; aspect-ratio: 16/9; background: #000; display: block; object-fit: cover; }
  .clip-card .info { padding: 10px 12px; }
  .clip-card .fname { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clip-card .fmeta { font-size: 12px; color: var(--dim); margin-top: 4px; }
  .empty { color: var(--dim); font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Clip<span>Drop</span></h1>
  <p>upload &middot; share &middot; watch</p>
</header>
<main>
  <div id="dropzone">
    <strong>Drop a video here</strong>
    <small>any format &middot; full quality &middot; Cloudflare Stream</small>
  </div>
  <input type="file" id="fileInput" accept="video/*" multiple />
  <div id="queue"></div>
  <section class="library">
    <h2>Your clips</h2>
    <div class="grid" id="grid"></div>
    <p class="empty" id="emptyMsg" hidden>No clips yet.</p>
  </section>
</main>
<script src="https://unpkg.com/tus-js-client@4.2.3/dist/tus.min.js"></script>
<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const grid = document.getElementById('grid');
const emptyMsg = document.getElementById('emptyMsg');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault(); dropzone.classList.remove('drag');
  [...e.dataTransfer.files].forEach(uploadFile);
});
fileInput.addEventListener('change', () => [...fileInput.files].forEach(uploadFile));

function formatBytes(bytes) {
  if (!bytes) return '0 B';
  const i = Math.floor(Math.log(bytes) / Math.log(1024));
  return `${(bytes / 1024 ** i).toFixed(1)} ${['B','KB','MB','GB'][i]}`;
}

function formatDuration(sec) {
  if (!sec) return '';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m ? `${m}m ${s}s` : `${s}s`;
}

async function waitReady(id, statusEl) {
  for (let i = 0; i < 120; i++) {
    const res = await fetch('/api/clips/' + encodeURIComponent(id));
    if (!res.ok) break;
    const clip = await res.json();
    if (clip.playbackReady) return clip;
    const pct = clip.pctComplete ? ` ${Math.round(clip.pctComplete)}%` : '';
    statusEl.textContent = `processing${pct}…`;
    await new Promise(r => setTimeout(r, 3000));
  }
  throw new Error('Processing timed out — refresh in a minute');
}

function uploadToStream(file, uploadUrl, tus, onProgress) {
  if (tus) {
    return new Promise((resolve, reject) => {
      const upload = new tus.Upload(file, {
        uploadUrl,
        chunkSize: 50 * 1024 * 1024,
        retryDelays: [0, 3000, 5000, 10000],
        onError: reject,
        onProgress: (sent, total) => onProgress(Math.round((sent / total) * 100)),
        onSuccess: resolve,
      });
      upload.start();
    });
  }
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', uploadUrl);
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100));
    };
    xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? resolve() : reject(new Error('Upload failed'));
    xhr.onerror = () => reject(new Error('Network error'));
    const form = new FormData();
    form.append('file', file);
    xhr.send(form);
  });
}

async function uploadFile(file) {
  const row = document.createElement('div');
  row.className = 'upload-row';
  row.innerHTML = `<div class="top"><span class="name">${file.name}</span><span class="status">preparing…</span></div><div class="bar"><div class="bar-fill"></div></div>`;
  document.getElementById('queue').prepend(row);
  const statusEl = row.querySelector('.status');
  const barFill = row.querySelector('.bar-fill');

  try {
    const res = await fetch('/api/upload-url', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        filename: file.name,
        contentType: file.type || 'video/mp4',
        fileSize: file.size,
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || 'Could not get upload URL');
    }
    const { uploadUrl, id, watchUrl, tus } = await res.json();

    statusEl.textContent = 'uploading…';
    await uploadToStream(file, uploadUrl, tus, (pct) => {
      barFill.style.width = pct + '%';
      statusEl.textContent = `uploading… ${pct}%`;
    });

    await waitReady(id, statusEl);
    barFill.style.width = '100%';
    statusEl.textContent = 'done';
    statusEl.classList.add('done');
    const link = document.createElement('a');
    link.href = watchUrl;
    link.textContent = 'Open clip →';
    row.appendChild(link);
    loadClips();
  } catch (err) {
    statusEl.textContent = err.message;
    statusEl.classList.add('error');
  }
}

async function loadClips() {
  const res = await fetch('/api/clips');
  const { clips } = await res.json();
  grid.innerHTML = '';
  emptyMsg.hidden = clips.length > 0;
  for (const clip of clips) {
    const a = document.createElement('a');
    a.className = 'clip-card';
    a.href = clip.watchUrl;
    const thumb = clip.thumbnail
      ? `<img class="thumb" src="${clip.thumbnail}" alt="" loading="lazy" />`
      : `<div class="thumb"></div>`;
    a.innerHTML = `${thumb}<div class="info"><div class="fname">${clip.name}</div><div class="fmeta">${formatBytes(clip.size)}${clip.duration ? ' · ' + formatDuration(clip.duration) : ''}${clip.processing ? ' · processing…' : ''}</div></div>`;
    grid.appendChild(a);
  }
}
loadClips();
</script>
</body>
</html>
