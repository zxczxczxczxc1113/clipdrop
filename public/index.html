<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
</head>
<body>
<div id="gate">
  <input id="user" placeholder="user" autocomplete="username">
  <input id="pass" type="password" placeholder="pass" autocomplete="current-password">
  <button id="loginBtn">login</button>
  <button id="regBtn">register</button>
  <span id="err"></span>
</div>
<div id="main" hidden>
  <input type="file" id="file" accept="video/*" multiple>
  <button id="out">logout</button>
  <ul id="list"></ul>
</div>
<script src="https://unpkg.com/tus-js-client@4.2.3/dist/tus.min.js"></script>
<script>
const gate = document.getElementById('gate');
const main = document.getElementById('main');
const err = document.getElementById('err');
const list = document.getElementById('list');

async function api(path, opts) {
  const r = await fetch(path, { credentials: 'same-origin', ...opts });
  const d = r.headers.get('content-type')?.includes('json') ? await r.json() : null;
  if (!r.ok) throw new Error(d?.error || 'err');
  return d;
}

async function boot() {
  const me = await api('/api/me');
  if (me.loggedIn) showMain();
}

function showMain() {
  gate.hidden = true;
  main.hidden = false;
  load();
}

document.getElementById('loginBtn').onclick = async () => {
  err.textContent = '';
  try {
    await api('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: user.value, pass: pass.value }),
    });
    showMain();
  } catch (e) { err.textContent = e.message; }
};

document.getElementById('regBtn').onclick = async () => {
  err.textContent = '';
  try {
    await api('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: user.value, pass: pass.value }),
    });
    showMain();
  } catch (e) { err.textContent = e.message; }
};

document.getElementById('out').onclick = async () => {
  await api('/api/logout', { method: 'POST' });
  location.reload();
};

async function waitReady(id) {
  for (let i = 0; i < 120; i++) {
    const c = await api('/api/clips/' + encodeURIComponent(id));
    if (c.playbackReady) return c;
    await new Promise(r => setTimeout(r, 3000));
  }
  throw new Error('timeout');
}

function uploadFile(file) {
  const li = document.createElement('li');
  li.textContent = file.name + ' …';
  list.prepend(li);
  (async () => {
    try {
      const { uploadUrl, id, tus, url } = await api('/api/upload-url', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: file.name, contentType: file.type || 'video/mp4', fileSize: file.size }),
      });
      if (tus) {
        await new Promise((ok, no) => {
          new tus.Upload(file, {
            uploadUrl, chunkSize: 50 * 1024 * 1024,
            onError: no, onSuccess: ok,
            onProgress: (s, t) => { li.textContent = file.name + ' ' + Math.round(s / t * 100) + '%'; },
          }).start();
        });
      } else {
        await new Promise((ok, no) => {
          const x = new XMLHttpRequest();
          x.open('POST', uploadUrl);
          x.upload.onprogress = (e) => {
            if (e.lengthComputable) li.textContent = file.name + ' ' + Math.round(e.loaded / e.total * 100) + '%';
          };
          x.onload = () => (x.status < 300 ? ok() : no());
          x.onerror = no;
          const f = new FormData();
          f.append('file', file);
          x.send(f);
        });
      }
      li.textContent = file.name + ' processing';
      await waitReady(id);
      li.innerHTML = `<a href="${url}">${file.name}</a> <button type=button>copy</button>`;
      li.querySelector('button').onclick = () => navigator.clipboard.writeText(url);
    } catch (e) {
      li.textContent = file.name + ' ' + e.message;
    }
  })();
}

file.onchange = () => [...file.files].forEach(uploadFile);

async function load() {
  list.innerHTML = '';
  const { clips } = await api('/api/clips');
  for (const c of clips) {
    const li = document.createElement('li');
    li.innerHTML = `<a href="${c.url}">${c.name}</a> <button type=button>copy</button>`;
    li.querySelector('button').onclick = () => navigator.clipboard.writeText(c.url);
    list.appendChild(li);
  }
}

boot();
</script>
</body>
</html>
