<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ClipDrop</title>
<style>
  :root { --bg: #09090b; --panel: #131316; --border: #27272a; --text: #fafafa; --dim: #71717a; --accent: #6366f1; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; min-height: 100vh; }
  header { padding: 18px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  header a { color: var(--dim); text-decoration: none; font-size: 14px; }
  header h1 { margin: 0; font-size: 18px; }
  header h1 span { color: var(--accent); }
  main { max-width: 1000px; margin: 0 auto; padding: 28px; }
  .player-wrap { background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); aspect-ratio: 16/9; }
  .player-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
  .meta-row { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .fname { font-size: 16px; font-weight: 600; word-break: break-all; }
  .fmeta { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .actions { display: flex; gap: 8px; }
  button, .btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; text-decoration: none; }
  #status { color: var(--dim); text-align: center; padding: 80px 0; }
</style>
</head>
<body>
<header><a href="/">&larr; All clips</a><h1>Clip<span>Drop</span></h1></header>
<main>
  <div id="status">Loading…</div>
  <div id="content" hidden>
    <div class="player-wrap">
      <iframe id="player" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" allowfullscreen></iframe>
    </div>
    <div class="meta-row">
      <div><div class="fname" id="fname"></div><div class="fmeta" id="fmeta"></div></div>
      <div class="actions"><button id="copyBtn">Copy link</button></div>
    </div>
  </div>
</main>
<script>
function formatBytes(b) {
  if (!b) return '';
  const i = Math.floor(Math.log(b) / Math.log(1024));
  return `${(b / 1024 ** i).toFixed(1)} ${['B','KB','MB','GB'][i]}`;
}

function formatDuration(sec) {
  if (!sec) return '';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m ? `${m}m ${s}s` : `${s}s`;
}

async function load() {
  const id = new URLSearchParams(location.search).get('clip');
  const statusEl = document.getElementById('status');
  if (!id) { statusEl.textContent = 'No clip specified.'; return; }

  try {
    let clip;
    for (let i = 0; i < 120; i++) {
      const res = await fetch('/api/clips/' + encodeURIComponent(id));
      if (!res.ok) throw new Error('Clip not found');
      clip = await res.json();
      if (clip.playbackReady) break;
      const pct = clip.pctComplete ? ` ${Math.round(clip.pctComplete)}%` : '';
      statusEl.textContent = `Processing${pct}…`;
      await new Promise(r => setTimeout(r, 3000));
    }
    if (!clip.playbackReady) {
      statusEl.textContent = 'Still processing — refresh in a minute.';
      return;
    }

    document.getElementById('player').src = clip.iframeUrl;
    document.getElementById('fname').textContent = clip.name;
    const meta = [formatBytes(clip.size), formatDuration(clip.duration)].filter(Boolean).join(' · ');
    document.getElementById('fmeta').textContent = meta;
    document.getElementById('copyBtn').onclick = () => {
      navigator.clipboard.writeText(location.href);
      const b = document.getElementById('copyBtn');
      const o = b.textContent;
      b.textContent = 'Copied!';
      setTimeout(() => { b.textContent = o; }, 1500);
    };
    statusEl.hidden = true;
    document.getElementById('content').hidden = false;
  } catch (e) {
    statusEl.textContent = e.message;
  }
}
load();
</script>
</body>
</html>
